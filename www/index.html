        function getActiveChild() {
            if (!Array.isArray(S.children) || !S.children.length) {

                const sess = sessionStorage.getItem('zb_active_child');
                if (sess && S.children.some(c => c.id === sess)) activeId = sess;

            let ch = S.children.find(c => c.id === activeId);
            if (!ch) {
                ch = S.children[0];

            }
            return ch;

            const ch = getActiveChild();

            const ch = getActiveChild();

            ch.hero = S.hero;
            ch.avatar = S.hero;

        // Serverga to'liq pochta/telefon yuborilmaydi, faqat yashirin ko'rinishi (al***@gmail.com, ***4567)
        function maskId(type, id) {
            const v = String(id == null ? '' : id).trim();
            if (!v) return '';
            if (v.includes('*')) return v.slice(0, 80);
            if (type === 'phone') { const d = v.replace(/\D/g, ''); return d.length > 4 ? '***' + d.slice(-4) : '***'; }
            const at = v.indexOf('@');
            if (at < 1) return v.slice(0, 2) + '***';
            return v.slice(0, Math.min(2, at)) + '***' + v.slice(at);
        }
        function pickState() {
            commitActiveChild();

        async function pushState(keepalive = false) {
            if (!UID) return;

            const state = pickState();
            const snap = JSON.stringify(state);
            try {
                const r = await fetch(`/api/state/${UID}`, { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ state }), keepalive });

                const { updatedAt } = await r.json();

        const later = (fn, ms) => { const t = setTimeout(() => { rt.timers = rt.timers.filter(x => x !== t); fn(); }, ms); rt.timers.push(t); return t; };
        const idOf = (kind, i) => kind + i;

        const allDone = () => LETTERS.every((_, i) => progOf('L' + i) === 3) && DIGITS.every((_, i) => progOf('N' + i) === 3);

        /* =====================================================================
           3. TOVUSH DVIGATELI & GLOBAL AUDIO

        class Snd {
            constructor() { this.ctx = null; this.timer = null; this.n = 0; this.i = 3; }
            get globalMuted() {
                return !S.settings.sound && !S.settings.music;
            }
            toggleMute() {
                const nowMuted = !this.globalMuted;
                S.settings.sound = !nowMuted;
                S.settings.music = !nowMuted;
                if (nowMuted) {
                    if ('speechSynthesis' in window) speechSynthesis.cancel();
                    if (this.master) this.master.gain.value = 0.0001;
                } else {
                    if (this.master) this.master.gain.value = 0.85;
                    this.init();
                }
                this.sync();
                save();
                this.updateButtons();
                if (!nowMuted) {
                    this.pop();
                    say("Tovush yoqildi!");
                }
            }
            updateButtons() {
                $$('[data-a="toggleAudio"]').forEach(btn => {
                    btn.classList.toggle('muted', this.globalMuted);
                    btn.textContent = this.globalMuted ? '🔇' : '🔊';
                });
            }
            init() {
                if (!this.ctx) {
                    const A = window.AudioContext || window.webkitAudioContext; if (!A) return;
                    try { this.ctx = new A(); } catch (e) { return; }
                    const c = this.ctx; this.master = c.createGain(); this.master.gain.value = this.globalMuted ? 0.0001 : .85; this.master.connect(c.destination);
                    this.mus = c.createGain(); this.mus.gain.value = .07;
                    this.dly = c.createDelay(1); this.dly.delayTime.value = .34; const fb = c.createGain(); fb.gain.value = .4;
                    this.dly.connect(fb); fb.connect(this.dly); this.mus.connect(this.master); this.mus.connect(this.dly); this.dly.connect(this.master);
                }
                if (this.ctx.state === 'suspended') this.ctx.resume();
                this.sync();
            }
            tone(f, d = .2, type = 'sine', v = .2, t0 = 0, dest) {
                if (this.globalMuted || !S.settings.sound || !this.ctx) return;
                const c = this.ctx, t = c.currentTime + t0, o = c.createOscillator(), g = c.createGain();

        function generateCertificate(type, data) {
            const canvas = document.createElement('canvas');
            canvas.width = 800;
            canvas.height = 600;
            const ctx = canvas.getContext('2d');

            // Background
            const gradient = ctx.createLinearGradient(0, 0, 800, 600);
            gradient.addColorStop(0, '#fff7ed');
            gradient.addColorStop(1, '#fef3c7');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 800, 600);

            // Border
            ctx.strokeStyle = '#f59e0b';
            ctx.lineWidth = 8;
            ctx.strokeRect(20, 20, 760, 560);
            ctx.strokeStyle = '#fbbf24';
            ctx.lineWidth = 4;
            ctx.strokeRect(35, 35, 730, 530);

            // Decorations
            ctx.fillStyle = '#fde68a';
            for (let i = 0; i < 20; i++) {
                ctx.beginPath();
                ctx.arc(Math.random() * 800, Math.random() * 600, Math.random() * 8 + 2, 0, Math.PI * 2);
                ctx.fill();
            }

            // Title
            ctx.fillStyle = '#7c5cff';
            ctx.font = 'bold 48px Fredoka, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('🎓 SERTIFIKAT 🎓', 400, 100);

            // Type
            ctx.fillStyle = '#1f2937';
            ctx.font = 'bold 32px Fredoka, sans-serif';
            let title = '';
            if (type === 'letters') title = 'Barcha harflarni o\'rgandi!';
            else if (type === 'numbers') title = 'Barcha raqamlarni o\'rgandi!';
            else if (type === 'all') title = 'Barcha darslarni tugatdi!';
            else if (type === 'colors') title = 'Ranglarni o\'rgandi!';
            ctx.fillText(title, 400, 180);

            // Hero name
            ctx.fillStyle = '#5b3fd6';
            ctx.font = 'bold 40px Caveat, cursive';
            ctx.fillText(data.heroName || 'Bola', 400, 280);

            // Stars
            ctx.font = '48px sans-serif';
            ctx.fillText('⭐ ⭐ ⭐', 400, 350);

            // Date
            ctx.fillStyle = '#6b7280';
            ctx.font = '24px Fredoka, sans-serif';
            ctx.fillText('Sana: ' + new Date().toLocaleDateString('uz-UZ'), 400, 450);

            // App name
            ctx.fillStyle = '#7c5cff';
            ctx.font = '28px Fredoka, sans-serif';
            ctx.fillText('Zukko Bolajon', 400, 520);

            return canvas;
        }

        function extractWaypoints(mask, start) {
            const pts = [];

            pts.push({ x: sx, y: sy });
            const visited = new Uint8Array(360000);
            visited[sy * 600 + sx] = 1;
            let cur = { x: sx, y: sy };

            for (let iter = 0; iter < 80; iter++) {
                let best = null, bestDist = 9999;
                const R = 24;
                for (let dy = -R; dy <= R; dy += 4) {
                    for (let dx = -R; dx <= R; dx += 4) {
                        const nx = cur.x + dx, ny = cur.y + dy;
                        if (nx < 15 || nx >= 585 || ny < 15 || ny >= 585) continue;
                        const idx = ny * 600 + nx;
                        if (mask[idx] && !visited[idx]) {
                            const d = Math.hypot(dx, dy);
                            if (d >= 12 && d <= 26 && d < bestDist) {
                                bestDist = d;
                                best = { x: nx, y: ny };
                            }
                        }
                    }
                }
                if (!best) break;
                for (let vy = -10; vy <= 10; vy += 4) {
                    for (let vx = -10; vx <= 10; vx += 4) {
                        const px = best.x + vx, py = best.y + vy;
                        if (px >= 0 && px < 600 && py >= 0 && py < 600) visited[py * 600 + px] = 1;
                    }
                }
                pts.push(best);
                cur = best;
            }
            if (pts.length < 2) pts.push({ x: sx + 20, y: sy + 30 });
            return pts;

        /* ---------- RANGLI SHARLAR MINI-O'YINI (BALLOONS) ---------- */

        function startBalloonGame() {

        function updateBalloonTargetUI() {
            if (!BP || !BP.target) return;
            const dot = $('#bpTargetDot'), nm = $('#bpTargetName'), sc = $('#bpScore');
            if (dot) dot.style.background = BP.target.hex;
            if (nm) { nm.textContent = BP.target.name; nm.style.color = BP.target.hex; }
            if (sc) sc.textContent = BP.score;

        function promptBalloonTarget() {
            if (!BP || !BP.target) return;

            say(`${h}: ${BP.target.name} sharni yor!`);

        function spawnBalloonObj() {
            const layer = $('#balloonLayer');
            if (!layer || !BP) return;
            const col = pickOne(BALLOON_COLORS);
            const w = 76, h = 106;
            const screenW = Math.max(320, window.innerWidth);
            const screenH = Math.max(480, window.innerHeight);
            const x = 20 + Math.random() * (screenW - w - 40);
            const y = screenH + 20;
            const speed = 1.3 + Math.random() * 1.6;
            const freq = 0.02 + Math.random() * 0.03;
            const amp = 15 + Math.random() * 25;
            const phase = Math.random() * Math.PI * 2;

            const el = document.createElement('div');
            el.className = 'balloon-obj';
            el.style.width = w + 'px';
            el.style.height = h + 'px';
            el.style.left = '0px';
            el.style.top = '0px';
            el.style.transform = `translate(${x}px, ${y}px)`;

            const gradId = 'bg_' + Math.random().toString(36).slice(2, 8);
            el.innerHTML = `
                <svg width="74" height="104" viewBox="0 0 74 104" style="pointer-events:none">
                    <defs>
                        <radialGradient id="${gradId}" cx="35%" cy="30%" r="65%">
                            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
                            <stop offset="30%" stop-color="${col.hex}" stop-opacity="0.95"/>
                            <stop offset="100%" stop-color="${col.hex}"/>
                        </radialGradient>
                    </defs>
                    <ellipse cx="37" cy="42" rx="34" ry="40" fill="url(#${gradId})"/>
                    <polygon points="34,82 40,82 37,88" fill="${col.hex}"/>
                    <path d="M37 88 Q32 94 37 102" stroke="rgba(0,0,0,0.3)" stroke-width="2" fill="none"/>
                </svg>
            `;

            const bObj = { el, color: col, x, y, baseX: x, speed, freq, amp, phase, t: 0 };

            el.onpointerdown = e => {
                e.preventDefault();
                e.stopPropagation();
                onBalloonTap(bObj);
            };

            layer.appendChild(el);
            BP.balloons.push(bObj);
        }

        function onBalloonTap(bObj) {
            if (!BP || !BP.running) return;
            if (bObj.color.id === BP.target.id) {
                popBalloon(bObj);
                BP.score++;
                const sc = $('#bpScore');
                if (sc) sc.textContent = BP.score;
                snd.pop();
                snd.tone(880 + Math.random() * 200, 0.08, 'triangle', 0.25);
                react('cheer');
                if (BP.score % 5 === 0) coins(2, bObj.el);

                const ch = getActiveChild();
                if (ch) {
                    ch.balloonScore = Math.max(ch.balloonScore || 0, BP.score);
                    save();
                    if (UID) {
                        fetch(`/api/children/${ch.id}/stats`, {
                            method: 'POST',
                            headers: { 'content-type': 'application/json' },
                            body: JSON.stringify({ uid: UID, balloonScore: ch.balloonScore })
                        }).catch(() => {});
                    }

                const others = BALLOON_COLORS.filter(c => c.id !== BP.target.id);

                say(pickOne(PRAISE) + `! Endi ${BP.target.name} sharni yor!`);

                snd.wrong();

                bObj.el.classList.add('balloon-shake');
                say(`Yo'q, bu ${bObj.color.name}. ${BP.target.name} sharni yor!`);
            }
        }

        function popBalloon(bObj) {
            const idx = BP.balloons.indexOf(bObj);
            if (idx >= 0) BP.balloons.splice(idx, 1);
            const rect = bObj.el.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            bObj.el.remove();
            createParticleBurst(cx, cy, bObj.color.hex);
        }

        function createParticleBurst(cx, cy, hex) {
            const count = 18;
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'balloon-particle';
                const size = 8 + Math.random() * 10;
                p.style.cssText = `position:fixed;left:${cx}px;top:${cy}px;width:${size}px;height:${size}px;border-radius:50%;background:${hex};pointer-events:none;z-index:100;box-shadow:0 0 8px ${hex};`;
                document.body.appendChild(p);
                const angle = Math.random() * Math.PI * 2;
                const dist = 40 + Math.random() * 80;
                const dx = Math.cos(angle) * dist;
                const dy = Math.sin(angle) * dist;
                p.animate([
                    { transform: 'translate(0, 0) scale(1)', opacity: 1 },
                    { transform: `translate(${dx}px, ${dy}px) scale(0)`, opacity: 0 }
                ], {
                    duration: 500 + Math.random() * 300,
                    easing: 'cubic-bezier(0.25, 1, 0.5, 1)'
                }).onfinish = () => p.remove();
            }
        }

        function runBalloonLoop() {
            function step(ts) {
                if (rt.scr !== 'balloons' || !BP || !BP.running) {
                    if (BP) {
                        BP.balloons.forEach(b => b.el.remove());
                        BP.balloons = [];
                        BP.running = false;
                    }
                    return;
                }

                if (ts - BP.lastSpawn > 950 && BP.balloons.length < 8) {
                    spawnBalloonObj();
                    BP.lastSpawn = ts;
                }

                for (let i = BP.balloons.length - 1; i >= 0; i--) {
                    const b = BP.balloons[i];
                    b.y -= b.speed;
                    b.t += 0.05;
                    b.x = b.baseX + Math.sin(b.t * b.freq + b.phase) * b.amp;
                    b.el.style.transform = `translate(${b.x}px, ${b.y}px)`;

                    if (b.y < -130) {
                        b.el.remove();
                        BP.balloons.splice(i, 1);
                    }
                }

                BP.animId = requestAnimationFrame(step);
            }
            BP.animId = requestAnimationFrame(step);
        }

        /* ---------- O'YINLAR PANELI ---------- */

        /* ---------- LABIRINT O'YINI ---------- */
        let MAZE = null;
        function newMazeGame() {
            const size = 7;
            const grid = [];
            for (let y = 0; y < size; y++) {
                grid[y] = [];
                for (let x = 0; x < size; x++) {
                    grid[y][x] = Math.random() < 0.3 ? 1 : 0;
                }
            }
            let px = 0, py = 0;
            grid[0][0] = 0;
            while (px < size - 1 || py < size - 1) {
                if (px === size - 1) py++;
                else if (py === size - 1) px++;
                else if (Math.random() < 0.5) px++;
                else py++;

                const it = ITEM[v], eq = S.equip[S.hero];
                if (S.owned.includes(v)) { eq[it.cat] = v; save(); snd.whoosh(); render(); react('cheer', 1200); return; }
                if (S.coins >= it.price) { S.coins -= it.price; S.owned.push(v); eq[it.cat] = v; save(); snd.success(); confetti(60); say('Yangi narsa!'); render(); react('cheer', 1500); }
                else { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); snd.wrong(); react('sad', 1200); say("Tangalar yetmayapti. Mashq qilamiz!"); }
            },
            downloadCert(v) {
                downloadCertificate(v, { heroName: S.hero === 'muhammad' ? 'Muhammad' : 'Hadicha' });
                snd.success();
                say("Sertifikat yuklab olindi!");
            },
            changeHero() { S.hero = S.hero === 'muhammad' ? 'hadicha' : 'muhammad'; save(); render(); },
            testAll() { if (!confirm("Barcha harf va raqamlar bajarilgan deb belgilansinmi? (Test uchun)")) return; LETTERS.forEach((_, i) => S.prog['L' + i] = 3); DIGITS.forEach((_, i) => S.prog['N' + i] = 3); save(); render(); },
            resetAll() { if (!confirm("Bolaning barcha progressi, tangalari va statistikasi o'chiriladi. Davom etasizmi?")) return; const a = S.auth, h = S.hero; Object.assign(S, defaults(), { auth: a, hero: h }); save(); render(); },
            logout() { if (!confirm('Hisobdan chiqilsinmi?')) return; S.auth = null; save(); go('auth'); },

            // Profil boshqaruvi
            openProfilePicker: () => showProfilePicker(),
            selectChild: id => switchActiveChild(id),
            openAddChild: () => showAddChildModal(),
            chooseNewHero: h => {
                _selectedHero = h;
                const m = $('#heroPickM'), hd = $('#heroPickH');
                if (m && hd) {
                    m.style.borderColor = h === 'muhammad' ? 'var(--p)' : '#cbd5e1';
                    hd.style.borderColor = h === 'hadicha' ? 'var(--p)' : '#cbd5e1';
                }
            },
            saveNewChild: () => saveNewChild(),
            switchParentChild: id => { switchActiveChild(id); render(); },

            // Global tovush
            toggleAudio: () => snd.toggleMute(),

            // Modullar & Mini-o'yinlar
            syllables: () => go('syllables'),
            balloons: () => go('balloons'),
            sylMerge: () => sylMerge(),
            sylSay: () => {
                const cur = SYLLABLE_PAIRS[SYL.idx % SYLLABLE_PAIRS.length];
                say(cur.word);
            },
            sylMic: () => sylMic(),
            sylNext: () => sylNext(),
            sayTargetColor: () => promptBalloonTarget(),

            // Ota-ona himoyasi & PIN
            gateMathSwitch() { if (gate) { gate.mode = 'math'; renderGateModal(); } },
            gatePinSwitch() { if (gate) { gate.mode = 'pin'; renderGateModal(); } },
            forgotPin() { startForgotPin(); },
            verifyOtp() { verifyPinOtp(); },
            pinKey: k => {
                if (!gate || gate.mode !== 'pin') return;
                if (k === 'x') {
                    gate.pinVal = gate.pinVal.slice(0, -1);
                } else if (k === 'ok') {
                    checkPinEntry();
                    return;
                } else if (gate.pinVal.length < 4) {
                    gate.pinVal += k;
                    if (gate.pinVal.length === 4) {
                        setTimeout(checkPinEntry, 150);
                    }
                }
                renderGateModal();
            },
            mathKey: k => {
                if (!gate || gate.mode !== 'math') return;
                if (k === 'x') {
                    gate.mathVal = gate.mathVal.slice(0, -1);
                } else if (k === 'ok') {
                    if (+gate.mathVal === gate.mathA + gate.mathB) {
                        closeOv();
                        gate = null;
                        snd.success();
                        go('parent');
                        return;
                    }
                    snd.wrong();
                    gate.mathVal = '';
                    const m = $('#ov .modal');
                    if (m) { m.classList.remove('shake'); void m.offsetWidth; m.classList.add('shake'); }
                } else if (gate.mathVal.length < 3) {
                    gate.mathVal += k;
                }
                const gv = $('#gv');
                if (gv) gv.innerHTML = gate.mathVal || '&nbsp;';
            },
            changePin: () => showChangePinModal(),
            saveNewPin: () => saveNewPin(),
        };
        document.addEventListener('click', e => {
            const t = e.target.closest('[data-a]'); if (!t) return; snd.init(); rt.lastIn = Date.now();
            const f = A[t.dataset.a]; if (f) { if (!['pickCard', 'tileW', 'ansM', 'buy', 'shapePick', 'heroTap', 'memPick', 'colorPick', 'countPick', 'pinKey', 'mathKey'].includes(t.dataset.a)) snd.click(); f(t.dataset.v, t, e); }
        });
        document.addEventListener('pointerdown', () => { rt.lastIn = Date.now(); }, true);
        document.addEventListener('change', e => {
            const t = e.target; if (t.dataset.set) { S.settings[t.dataset.set] = +t.value; save(); }
            if (t.dataset.tog) { S.settings[t.dataset.tog] = t.checked; save(); if (!S.settings.sound && 'speechSynthesis' in window) speechSynthesis.cancel(); snd.sync(); }
        });
        document.addEventListener('visibilitychange', () => snd.sync());

        /* ---------- ⚙️ : uzoq bosish + ota-ona PIN qulfi ---------- */
        let holdT = null;
        document.addEventListener('pointerdown', e => {
            const g = e.target.closest('[data-gear]'); if (!g) return; g.classList.add('hold');
            holdT = setTimeout(() => { g.classList.remove('hold'); openGate(); }, 1400);
        });
        ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => document.addEventListener(ev, e => { clearTimeout(holdT); const g = $('#gear'); g && g.classList.remove('hold'); }, true));

        let gate = null;
        function openGate() {
            snd.click();
            gate = { mode: 'pin', pinVal: '', mathA: 8 + rnd(12), mathB: 4 + rnd(10), mathVal: '', serverCode: '' };
            renderGateModal();
        }

        function renderGateModal() {
            if (!gate) return;
            if (gate.mode === 'pin') {
                const dots = [0, 1, 2, 3].map(i => `<span class="pin-dot ${gate.pinVal.length > i ? 'filled' : ''}"></span>`).join('');
                overlay(`<div class="modal">
                    <div style="font-size:36px">🔒</div>
                    <h2 style="margin:6px 0 2px">Ota-onalar kodi</h2>
                    <div style="font-size:13px;opacity:.7">4 xonali PIN kodni kiriting (Standart: 1234)</div>
                    <div class="pin-display">${dots}</div>
                    <div class="pin-keypad">
                        ${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button class="pin-key" data-a="pinKey" data-v="${n}">${n}</button>`).join('')}
                        <button class="pin-key" data-a="pinKey" data-v="x">⌫</button>
                        <button class="pin-key" data-a="pinKey" data-v="0">0</button>
                        <button class="pin-key" data-a="pinKey" data-v="ok" style="background:#bbf7d0">✔</button>
                    </div>
                    <div class="row" style="margin-top:14px;gap:8px;flex-wrap:wrap">
                        <button class="btn alt" data-a="gateMathSwitch">🔢 Arifmetik qulf</button>
                        <button class="btn alt" data-a="forgotPin">❓ PINni tiklash</button>
                        <button class="btn alt" data-a="closeov">Bekor qilish</button>
                    </div>
                </div>`);
            } else if (gate.mode === 'math') {
                overlay(`<div class="modal">
                    <div style="font-size:36px">🧮</div>
                    <div style="font-size:15px;opacity:.7">Davom etish uchun hisoblang:</div>
                    <h2 style="margin:6px 0">${gate.mathA} + ${gate.mathB} = ?</h2>
                    <div class="gval" id="gv">${gate.mathVal || '&nbsp;'}</div>
                    <div class="pin-keypad">
                        ${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button class="pin-key" data-a="mathKey" data-v="${n}">${n}</button>`).join('')}
                        <button class="pin-key" data-a="mathKey" data-v="x">⌫</button>
                        <button class="pin-key" data-a="mathKey" data-v="0">0</button>
                        <button class="pin-key" data-a="mathKey" data-v="ok" style="background:#bbf7d0">✔</button>
                    </div>
                    <div class="row" style="margin-top:14px;gap:8px">
                        <button class="btn alt" data-a="gatePinSwitch">🔑 PIN orqali</button>
                        <button class="btn alt" data-a="closeov">Bekor qilish</button>
                    </div>
                </div>`);
            } else if (gate.mode === 'recover') {
                overlay(`<div class="modal">
                    <div style="font-size:36px">📧</div>
                    <h2 style="margin:6px 0">PIN kodni tiklash</h2>
                    <div style="font-size:13px;opacity:.75;max-width:320px;margin-bottom:12px">
                        Ro'yxatdan o'tgan pochta orqali yuborilgan 6 xonali tiklash kodini (OTP) kiriting:
                        ${gate.serverCode ? `<br><b style="color:#059669">Tiklash kodi: ${gate.serverCode}</b>` : ''}
                    </div>
                    <input id="otpIn" class="field" type="text" maxlength="6" placeholder="123456" style="text-align:center;font-size:24px;letter-spacing:6px;font-weight:700">
                    <div id="otpErr" style="color:#ef4444;font-size:14px;min-height:22px"></div>
                    <div class="row">
                        <button class="btn alt" data-a="gatePinSwitch">Orqaga</button>
                        <button class="btn" data-a="verifyOtp">Tasdiqlash</button>
                    </div>
                </div>`);
                setTimeout(() => { const el = $('#otpIn'); el && el.focus(); }, 100);
            }
        }

        function checkPinEntry() {
            const correctPin = S.parentPin || '1234';
            if (gate && gate.pinVal === correctPin) {
                closeOv();
                gate = null;
                snd.success();
                go('parent');
            } else {
                snd.wrong();
                if (gate) gate.pinVal = '';
                const m = $('#ov .modal');
                if (m) { m.classList.remove('shake'); void m.offsetWidth; m.classList.add('shake'); }
                renderGateModal();
            }
        }

        async function startForgotPin() {
            if (!gate) return;
            gate.mode = 'recover';
            gate.serverCode = '';
            renderGateModal();
            try {
                const resp = await fetch('/api/auth/parent/pin-recover', {
                    method: 'POST',
                    headers: { 'content-type': 'application/json' },
                    body: JSON.stringify({ uid: UID, email: (S.auth && S.auth.id) || '' })
                });
                if (resp.ok) {
                    const data = await resp.json();
                    if (data.code) {
                        gate.serverCode = data.code;
                        renderGateModal();
                        return;
                    }
                }
            } catch (_) {}
            // Oflayn yoki lokal rejimda tezkor OTP generator
            const localCode = String(Math.floor(100000 + Math.random() * 900000));
            gate.serverCode = localCode;
            renderGateModal();
        }

        function verifyPinOtp() {
            const entered = ($('#otpIn').value || '').trim();
            const err = $('#otpErr');
            if (entered.length !== 6) {
                if (err) err.textContent = "6 xonali kodni to'liq kiriting";
                return;
            }
            if (gate.serverCode && entered !== gate.serverCode) {
                if (err) err.textContent = "Noto'g'ri kod! Qayta urinib ko'ring";
                snd.wrong();
                return;
            }
            closeOv();
            gate = null;
            snd.success();
            say("PIN kod muvaffaqiyatli tiklandi!");
            go('parent');
        }

        function showChangePinModal() {
            overlay(`<div class="modal">
                <h2>Ota-ona PIN kodi</h2>
                <p style="font-size:14px;opacity:.7">Yangi 4 xonali PIN kodni kiriting:</p>
                <input id="newPinIn" class="field" type="password" maxlength="4" inputmode="numeric" placeholder="****" style="text-align:center;font-size:32px;letter-spacing:12px;font-weight:700">
                <div id="newPinErr" style="color:#ef4444;font-size:14px;min-height:22px"></div>
                <div class="row">
                    <button class="btn alt" data-a="closeov">Bekor qilish</button>
                    <button class="btn" data-a="saveNewPin">Saqlash</button>
                </div>
            </div>`);
            setTimeout(() => { const el = $('#newPinIn'); el && el.focus(); }, 100);
        }

        function saveNewPin() {
            const v = ($('#newPinIn').value || '').trim();
            const err = $('#newPinErr');
            if (!/^\d{4}$/.test(v)) {
                if (err) err.textContent = "PIN 4 ta raqamdan iborat bo'lishi kerak";
                return;
            }
            S.parentPin = v;
            save();
            closeOv();
            snd.success();
            say("PIN kod muvaffaqiyatli saqlandi!");
        }

        A.gk = (v) => {
            if (!gate) return;
            if (v === 'x') gate.v = (gate.v || '').slice(0, -1);
            else if (v === 'ok') { if (+gate.v === gate.a + gate.b) { closeOv(); gate = null; go('parent'); return; } snd.wrong(); const m = $('#ov .modal'); m.classList.remove('shake'); void m.offsetWidth; m.classList.add('shake'); gate.v = ''; }
            else if ((gate.v || '').length < 3) gate.v = (gate.v || '') + v;
            const gv = $('#gv'); if (gv) gv.innerHTML = gate.v || '&nbsp;';
        };

        /* =====================================================================
           10. AQLLI DAM OLISH TIZIMI
           ===================================================================== */
        function showBreak() {
            rt.exSince = 0; rt.studySec = 0;
            overlay(`<div class="modal kid"><div style="position:relative;width:170px"><div class="bob">${heroSVG(S.hero, 'cheer')}</div><div class="bubble" style="right:-70px">🎮❓</div></div><div class="row"><button class="ibtn big ok" data-a="breakYes">🎮</button><button class="ibtn big no" data-a="breakNo">⏭️</button></div></div>`);
            snd.giggle(); say(BREAK_TXT);
        }
        A.breakYes = () => { go('games'); };
        A.breakNo = () => { closeOv(); rt.studySec = Math.max(0, S.settings.breakMin * 60 - 180); rt.exSince = 0; };
        function showReturn() {
            rt.retShown = true;
            overlay(`<div class="modal kid"><div style="position:relative;width:170px"><div class="bob">${heroSVG(S.hero, 'happy')}</div><div class="bubble" style="right:-70px">📚❓</div></div><div class="row"><button class="ibtn big ok" data-a="retYes">📚</button><button class="ibtn big no" data-a="retNo">⏩</button></div></div>`);
            snd.giggle(); say(RETURN_TXT);
        }
        A.retYes = () => { rt.studySec = 0; rt.exSince = 0; go('letters'); };
        A.retNo = () => { closeOv(); rt.gameSec = Math.max(0, S.settings.gameMin * 60 - 120); rt.retShown = false; };
        function showLimit() {
            rt.limitShown = true;
            overlay(`<div class="modal kid"><div style="width:170px">${heroSVG(S.hero, 'sad')}</div><div class="bigemo">😴🌙</div></div>`); say("Bugun yetarli o'qidik. Ertaga yana ko'ramiz!");
        }
        setInterval(() => {
            if (document.hidden || !S.auth || ['auth', 'pick', 'parent'].includes(rt.scr)) return;
            if (Date.now() - rt.lastIn > 120000) { rt.studySec = 0; return; }
            const d = day(); d.sec++; S.totalSec++;
            const lim = S.settings.dailyMin;
            if (lim && d.sec >= lim * 60 && !rt.limitShown && !rt.ov) { showLimit(); return; }
            if (rt.scr === 'games') { rt.gameSec++; if (rt.gameSec >= S.settings.gameMin * 60 && !rt.retShown && !rt.ov) showReturn(); }
            else { rt.studySec++; if ((rt.studySec >= S.settings.breakMin * 60 || rt.exSince >= 10) && !rt.ov && !rt.drawing) showBreak(); }
            if (++rt.tick % 10 === 0) save();
        }, 1000);

        /* =====================================================================
           11. ISHGA TUSHIRISH
           ===================================================================== */
        fxInit();
        addEventListener('beforeunload', () => { save(); if (localStorage.getItem(DIRTY_KEY) === '1') pushState(true); });
        syncFromServer().finally(() => go(!S.auth ? 'auth' : (!S.hero ? 'pick' : 'home')));
    </script>
</body>

</html>
